
<!DOCTYPE html>
<html lang="en">
<head>

	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="favicon.png" type="image/x-icon">
	<title>Overcome Evil with Good</title>
	<style>
		body {
			background-color: black;
			color: white;
			font-family: monospace;
			margin: 0;
			padding: 0;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		h1 {
			font-size: 2rem;
			text-align: center;
			padding: 2rem;
			margin: 0;
			line-height: 1.4;
		}

		@media (max-width: 768px) {
			h1 {
				font-size: 1.5rem;
				padding: 1rem;
			}
		}

<body>
	<h1>Do not be overcome by evil, but overcome evil with good.</h1>
